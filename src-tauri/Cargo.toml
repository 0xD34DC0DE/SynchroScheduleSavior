[package]
name = "synchroschedulesavior"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5.3", features = [] }

[dependencies]
tauri = { version = "1.7", features = [ "window-show", "window-set-focus", "window-close", "shell-open", "test"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
url = "2.5.0"
rand = "0.8.5"
tokio = { version = "1", features = ["time"] }
anyhow = "1.0.77"
thiserror = "1.0"
devtools = "0.3.3"
tauri-plugin-graphql = { version = "2.1.0", features = ["chrono", "dataloader"] }
async-graphql = { version = "7.0.13", features = ["chrono", "dataloader"] }
chrono = "0.4.38"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "macros", "chrono", "sqlite"] }
itertools = "0.14.0"
derive_more = { version = "1.0.0", features = ["display", "constructor"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
